CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_IQS9151=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_USB=y
# First hardware validation: always use USB, without a BLE pairing.
CONFIG_ZMK_BLE=n

CONFIG_INPUT_IQS9151_RESOLUTION_X=1300
CONFIG_INPUT_IQS9151_RESOLUTION_Y=1192
CONFIG_INPUT_IQS9151_CURSOR_INERTIA_ENABLE=n
CONFIG_INPUT_IQS9151_SCROLL_INERTIA_ENABLE=n

CONFIG_ZMK_USB_HID_INIT_PRIORITY=93
CONFIG_ZMK_USB_INIT_PRIORITY=94
CONFIG_LOG=n
CONFIG_ZMK_USB_LOGGING=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
